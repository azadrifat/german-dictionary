name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.azadrifat --project-name german_dict /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="german_dict"#android:label="Woerterbuch"#' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: App build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
